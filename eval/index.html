<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Histórico de avaliação — RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f6f7fa; --surface: #ffffff; --surface-2: #f1f3f8; --surface-hover: #eef1f7;
  --border: #e3e7ef; --border-strong: #ccd3e0;
  --text: #171b24; --text-2: #475062; --muted: #78829a; --faint: #a8b0c0;
  --accent: #b3450a; --accent-2: #ea6a1f; --accent-soft: #fdf1e7;
  --ok: #0f7a4f; --ok-soft: #e4f4ec; --warn: #9a5b00; --warn-soft: #fbf1df;
  --err: #b3261e; --err-soft: #fdeceb;
  --series: #2a78d6;
  --grid: #e8ecf3;
  --shadow: 0 1px 2px rgba(23,27,36,.05), 0 1px 3px rgba(23,27,36,.04);
  --ui: 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
}
[data-theme="dark"] {
  --bg: #0d0f14; --surface: #111420; --surface-2: #0a0c12; --surface-hover: #161a27;
  --border: #1e2235; --border-strong: #2d3148;
  --text: #e6ebf3; --text-2: #b8c4d6; --muted: #8892a4; --faint: #5a6478;
  --accent: #fdba74; --accent-2: #fb923c; --accent-soft: #331e0d;
  --ok: #6ee7b7; --ok-soft: #10321f; --warn: #fbbf24; --warn-soft: #33260a;
  --err: #fca5a5; --err-soft: #331416;
  --series: #3987e5;
  --grid: #1c2133;
  --shadow: none;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--ui); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }

header {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 28px;
}
.head-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 14px; }
.title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.title-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); }
.title small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
button { font-family: inherit; cursor: pointer; border: 1px solid var(--border-strong);
         background: var(--surface); color: var(--text); border-radius: 8px;
         padding: 7px 12px; font-size: 13px; transition: background .15s; }
button:hover:not(:disabled) { background: var(--surface-hover); }
button:disabled { opacity: .55; cursor: progress; }

/* ── Nova execução: os estágios da busca, na ordem em que rodam ── */
.runpanel { background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
            box-shadow: var(--shadow); padding: 18px 20px 16px; margin-bottom: 18px; }
.stages { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.stage { position: relative; padding: 0 18px; min-width: 0; }
.stage:first-child { padding-left: 0; }
.stage:last-child { padding-right: 0; }
.stage + .stage { border-left: 1px solid var(--border); }
/* the arrow sits on the divider: this stage feeds the next */
.stage + .stage::before { content: '›'; position: absolute; left: -10px; top: 3px;
  width: 19px; height: 19px; line-height: 17px; text-align: center; font-size: 14px;
  color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 50%; }
.stage[hidden] { display: none; }
/* title + the step's quantity on one line, so every select stays on the same row */
.stage-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 26px; }
.stage-name { font-size: 13.5px; font-weight: 600; }
.stage-hint { font-size: 12px; color: var(--muted); margin: 2px 0 12px; line-height: 1.4;
              min-height: 2.8em; }  /* two lines everywhere: the selects line up */
.stage select, .stage input { font-family: inherit; font-size: 13px; color: var(--text);
  background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 8px;
  padding: 7px 8px; width: 100%; }
.stage select:disabled, .stage input:disabled { opacity: .5; }
.count { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.counts { display: flex; gap: 10px; }
.counts[hidden] { display: none; }
.stage .count input, .run-foot .count input { width: 50px; padding: 3px 6px; font-family: var(--mono); font-size: 12.5px; text-align: right; }
.run-foot { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 14px;
            border-top: 1px solid var(--border); }
#go { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; padding: 8px 16px; }
#go:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
#runmsg { font-size: 12.5px; color: var(--muted); }
#runmsg.err { color: var(--err); }
@media (max-width: 760px) {
  .stages { grid-auto-flow: row; }
  .stage, .stage:first-child, .stage:last-child { padding: 14px 0 0; }
  .stage + .stage { border-left: 0; border-top: 1px solid var(--border); margin-top: 14px; }
  .stage + .stage::before { display: none; }
  .stage-hint { min-height: 0; }
  header, main { padding-left: 16px; padding-right: 16px; }
}
#progress-sec { display: flex; align-items: center; gap: 12px; background: var(--surface);
                border: 1px solid var(--border); border-radius: 11px; box-shadow: var(--shadow);
                padding: 12px 14px; }
#runbar-progress { flex: 1; min-width: 0; height: 10px; accent-color: var(--accent); }
#progmsg { font-family: var(--mono); font-size: 12px; color: var(--text-2); white-space: nowrap; }
#progress-sec[hidden] { display: none; }

main { padding: 24px 28px 80px; }
section { margin-bottom: 34px; }
h2 { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase;
     letter-spacing: .06em; margin-bottom: 14px; }

/* ── Small multiples ─────────────────────────────────── */
.sparks { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 14px; }
.spark {
  background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
  padding: 13px 14px 8px; box-shadow: var(--shadow);
}
.spark-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.spark-name { font-size: 12px; font-weight: 600; color: var(--text-2); }
.spark-val { margin-left: auto; font-family: var(--mono); font-size: 17px; font-weight: 600; }
.spark-delta { font-family: var(--mono); font-size: 11.5px; }
.up { color: var(--ok); } .down { color: var(--err); } .flat { color: var(--muted); }
.spark svg { display: block; width: 100%; height: 62px; overflow: visible; }
.spark-foot { font-size: 10.5px; color: var(--faint); display: flex; justify-content: space-between; padding-top: 2px; }

/* ── Tabela ──────────────────────────────────────────── */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border);
              border-radius: 11px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 11px; color: var(--muted);
     text-transform: uppercase; letter-spacing: .05em; padding: 11px 13px;
     border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 11px 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr.run-row { cursor: pointer; }
tr.run-row:hover td { background: var(--surface-hover); }
tr.run-row.sel td { background: var(--accent-soft); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.rid { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.dim { color: var(--faint); }

.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px;
        border-radius: 5px; font-family: var(--mono); }
.pass { background: var(--ok-soft); color: var(--ok); }
.partial { background: var(--warn-soft); color: var(--warn); }
.fail { background: var(--err-soft); color: var(--err); }

.detail-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
button.danger { color: var(--err); border-color: var(--border-strong); font-size: 12.5px; padding: 5px 10px; }
button.danger:hover:not(:disabled) { background: var(--err-soft); border-color: var(--err); }
.cfg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { font-family: var(--mono); font-size: 11.5px; background: var(--surface-2);
        border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; color: var(--text-2); }
.chip b { color: var(--text); font-weight: 600; }

.qtext { font-size: 12.5px; line-height: 1.45; max-width: 460px; }
.chunks { font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.7; }
.chunks .hit { color: var(--ok); font-weight: 600; }
.chunks .miss { color: var(--faint); }
.state-msg { color: var(--muted); font-size: 13px; padding: 26px; text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
code { font-family: var(--mono); font-size: 12px; background: var(--surface-2);
       padding: 2px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div class="title">
      <span class="title-dot"></span>
      Histórico de avaliação
      <small id="sub">carregando…</small>
    </div>
    <button id="theme" type="button">◐ Tema</button>
  </div>
</header>

<main>
  <form class="runpanel" id="runf" aria-labelledby="run-title">
    <h2 id="run-title">Nova execução</h2>
    <div class="stages">
      <div class="stage" id="stage-q" role="group" aria-labelledby="sn-q" hidden>
        <div class="stage-head"><span class="stage-name" id="sn-q">Pergunta</span></div>
        <p class="stage-hint">Reescritas buscadas junto com a original.</p>
        <select id="variants" aria-label="variantes"><option value="0">só a original</option></select>
      </div>
      <div class="stage" id="stage-docs" role="group" aria-labelledby="sn-docs" hidden>
        <div class="stage-head"><span class="stage-name" id="sn-docs">Documentos</span>
          <label class="count" title="quantos PDFs passam pra busca de chunks">top <input id="doc_top" type="number" min="1" max="50" value="5" disabled aria-label="top documentos" /></label></div>
        <p class="stage-hint">Os resumos escolhem os PDFs antes dos chunks.</p>
        <select id="docs" aria-label="bucket de descrições"><option value="">todos os PDFs</option></select>
      </div>
      <div class="stage" role="group" aria-labelledby="sn-chunks">
        <div class="stage-head"><span class="stage-name" id="sn-chunks">Chunks</span>
          <label class="count" title="quantos chunks a busca devolve (k)">top <input id="k" type="number" min="1" max="50" value="5" aria-label="top chunks" /></label></div>
        <p class="stage-hint">Corpus, gabarito e retriever.</p>
        <select id="bucket" required aria-label="chunks bucket"><option value="">escolha o chunks bucket</option></select>
      </div>
      <div class="stage" role="group" aria-labelledby="sn-rerank">
        <div class="stage-head"><span class="stage-name" id="sn-rerank">Rerank</span>
          <span class="counts" id="rerank-tuning" hidden>
            <label class="count" title="quantos candidatos o reranker relê (depth)">top <input id="rerank_depth" type="number" min="1" max="100" value="30" disabled aria-label="candidatos do rerank" /></label>
            <label class="count" title="peso da ordem da busca contra o reranker (1.0); 0 = só o reranker">keep <input id="rerank_keep" type="number" min="0" max="10" step="0.1" value="1" disabled aria-label="peso da busca no rerank" /></label>
          </span></div>
        <p class="stage-hint" id="rerank-hint">Um cross-encoder relê os 30 primeiros.</p>
        <select id="rerank" aria-label="reranker"><option value="">sem rerank</option></select>
      </div>
    </div>
    <div class="run-foot">
      <label class="count" title="porcentagem das perguntas, sorteada a cada execução">perguntas <input id="sample" type="number" min="1" max="100" value="100" aria-label="porcentagem das perguntas" />%</label>
      <button id="go" type="submit">▶ Rodar</button>
      <span id="runmsg" role="status"></span>
    </div>
  </form>

  <section id="progress-sec" hidden>
    <progress id="runbar-progress"></progress>
    <span id="progmsg"></span>
    <button id="cancel" type="button">✕ Cancelar</button>
  </section>

  <section id="trend-sec" hidden>
    <h2>Progresso</h2>
    <div class="sparks" id="sparks"></div>
  </section>

  <section id="runs-sec" hidden>
    <h2>Execuções</h2>
    <div class="table-wrap"><table id="runs"></table></div>
  </section>

  <section id="detail-sec" hidden>
    <div class="detail-head">
      <h2 id="detail-title">Detalhe</h2>
      <button id="del-run" type="button" class="danger">Excluir execução</button>
    </div>
    <div class="cfg" id="detail-cfg"></div>
    <div class="table-wrap"><table id="detail"></table></div>
  </section>

  <div class="state-msg" id="empty" hidden></div>
</main>

<script>
const METRICS = ['hit_rate', 'recall', 'precision', 'mrr', 'ndcg']
const LABELS = {
  hit_rate: 'Hit Rate', recall: 'Recall', precision: 'Precision',
  mrr: 'MRR', ndcg: 'nDCG',
}
// One question each metric answers — the panel title alone is jargon.
const BLURB = {
  hit_rate: 'trouxe ao menos 1 certo?',
  recall: '% dos certos que vieram',
  precision: '% do que veio que prestava',
  mrr: 'o certo veio no topo?',
  ndcg: 'achou + posição, nota única',
}
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const fmt = n => (n ?? 0).toFixed(3)

// ── Tema ───────────────────────────────────────────────
const stored = (() => { try { return localStorage.getItem('theme') } catch { return null } })()
if (stored) document.documentElement.dataset.theme = stored
else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'
$('theme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'
  document.documentElement.dataset.theme = next
  try { localStorage.setItem('theme', next) } catch {}
}

// ── Small multiples ────────────────────────────────────
// Five panels rather than five lines on one axis: the metrics move together,
// so overlaid they read as noise. One hue, faceted, y pinned to 0..1 so the
// panels are comparable to each other and a flat run looks flat.
function sparkline(values) {
  const W = 100, H = 40, n = values.length
  if (n === 0) return ''
  const x = i => n === 1 ? W / 2 : (i / (n - 1)) * W
  const y = v => H - v * H
  const pts = values.map((v, i) => [x(i), y(v)])

  const grid = [0, 0.5, 1].map(v =>
    `<line x1="0" y1="${y(v)}" x2="${W}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"
           vector-effect="non-scaling-stroke" />`).join('')

  const path = n === 1 ? '' :
    `<path d="M${pts.map(p => p.join(',')).join('L')}" fill="none" stroke="var(--series)"
           stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
           vector-effect="non-scaling-stroke" />`

  const dots = pts.map(([px, py], i) =>
    `<circle cx="${px}" cy="${py}" r="${i === n - 1 ? 3.6 : 2.2}"
             fill="var(--series)" stroke="var(--surface)" stroke-width="2"
             vector-effect="non-scaling-stroke">
       <title>run ${i + 1}: ${fmt(values[i])}</title>
     </circle>`).join('')

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
               aria-label="tendência, ${n} execuções, último ${fmt(values[n - 1])}">
            ${grid}${path}${dots}
          </svg>`
}

function renderSparks(runs) {
  // index.json is newest-first; a trend reads left to right, oldest to newest.
  const chrono = [...runs].reverse()
  $('sparks').innerHTML = METRICS.map(m => {
    const vals = chrono.map(r => r.metrics[m])
    const last = vals[vals.length - 1]
    const prev = vals.length > 1 ? vals[vals.length - 2] : null
    const d = prev === null ? null : last - prev
    const cls = d === null ? 'flat' : Math.abs(d) < 5e-4 ? 'flat' : d > 0 ? 'up' : 'down'
    const arrow = d === null ? '' : Math.abs(d) < 5e-4 ? '→' : d > 0 ? '↑' : '↓'
    return `
      <div class="spark">
        <div class="spark-head">
          <span class="spark-name">${LABELS[m]}</span>
          <span class="spark-val">${fmt(last)}</span>
        </div>
        <div class="spark-head">
          <span class="spark-delta ${cls}">${d === null ? 'primeira execução' : `${arrow} ${d >= 0 ? '+' : ''}${d.toFixed(3)}`}</span>
        </div>
        ${sparkline(vals)}
        <div class="spark-foot"><span>${BLURB[m]}</span><span>0–1</span></div>
      </div>`
  }).join('')
}

// ── Tabela de execuções ────────────────────────────────
function renderRuns(runs) {
  $('runs').innerHTML = `
    <thead><tr>
      <th>Execução</th><th>Chunker</th><th>Retriever</th><th>Descrições</th><th>Rerank</th><th class="num">Variantes</th><th class="num">k</th><th class="num">Perguntas</th><th class="num">Chunks</th>
      ${METRICS.map(m => `<th class="num">${LABELS[m]}</th>`).join('')}
    </tr></thead>
    <tbody>${runs.map(r => { const c = r.config || {}; return `
      <tr class="run-row" data-run="${esc(r.run_id)}" title="${esc(c.bucket_name)} (${esc(c.bucket)})">
        <td class="rid">${esc(r.run_id)}${r.failures ? ` <span class="pill fail">${r.failures} erro(s)</span>` : ''}</td>
        <td class="rid">${c.chunker ? esc(c.chunker.name) : `<span class="dim">${esc(c.bucket_name || '—')}</span>`}</td>
        <td class="rid">${esc(c.retriever || c.embedding_model)}</td>
        <td class="rid">${c.docs ? `${esc(c.docs_retriever)} · top-${c.doc_top} docs` : '<span class="dim">—</span>'}</td>
        <td class="rid">${c.rerank ? esc(c.rerank) + (c.rerank_depth != null ? ` · top-${c.rerank_depth} · keep ${c.rerank_keep}` : '') : '<span class="dim">—</span>'}</td>
        <td class="num">${c.variants || '<span class="dim">—</span>'}</td>
        <td class="num">${c.k ?? ''}</td>
        <td class="num" title="${c.sample_pct < 100 ? `amostra aleatória de ${c.sample_pct}%` : 'todas'}">${c.n_queries ?? ''}${c.sample_pct < 100 ? ` <span class="dim">${c.sample_pct}%</span>` : ''}</td>
        <td class="num">${c.n_chunks ?? ''}</td>
        ${METRICS.map(m => `<td class="num">${fmt(r.metrics[m])}</td>`).join('')}
      </tr>` }).join('')}
    </tbody>`
  $('runs').querySelectorAll('.run-row').forEach(tr => {
    // sem scroll: a tabela é a navegação, pular pro detalhe tira ela da vista
    tr.onclick = () => showDetail(tr.dataset.run, false)
  })
}

// ── Detalhe de uma execução ────────────────────────────
async function showDetail(runId, scroll = true) {
  $('runs').querySelectorAll('.run-row').forEach(tr =>
    tr.classList.toggle('sel', tr.dataset.run === runId))

  const run = await (await fetch(`runs/${runId}.json`, { cache: 'no-store' })).json()
  const c = run.config
  $('del-run').dataset.run = runId
  $('detail-title').textContent = `Detalhe — ${run.label}`
  $('detail-cfg').innerHTML = [
    ['k', c.k],
    ['bucket', c.bucket ? `${c.bucket_name} (${c.bucket})` : '—'],
    ['retriever', c.retriever || c.embedding_model],
    ['descrições', c.docs ? `${c.docs_name} (${c.docs}) · top-${c.doc_top}` : '—'],
    ['rerank', c.rerank ? c.rerank + (c.rerank_depth != null ? ` · top-${c.rerank_depth} · keep ${c.rerank_keep}` : '') : '—'],
    ['variantes', c.variants ? `${c.variants} (${c.transform_model})` : '—'],
    ...(c.chunker ? Object.entries(c.chunker).filter(([k, v]) => k !== 'name' && v !== '' && v !== 0 && v !== false)
                      .map(([k, v]) => [k, v]) : []),
    ['chunks', c.n_chunks ?? '?'],
    ['qrels', c.n_qrels ?? (c.dataset ? c.dataset : '?')],
    ['perguntas', c.sample_pct < 100 ? `${c.n_queries} de ${c.n_queries_total} (${c.sample_pct}% sorteadas)` : c.n_queries],
    ['corpus', (c.corpus_sha256 || '').slice(0, 12)],
  ].map(([k, v]) => `<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join('')
    + METRICS.map(m => `<span class="chip">${LABELS[m]} single <b>${fmt(run.metrics_by_type.single_chunk[m])}</b> · multi <b>${fmt(run.metrics_by_type.multi_chunk[m])}</b></span>`).join('')

  $('detail').innerHTML = `
    <thead><tr>
      <th>#</th><th>Pergunta</th><th>Tipo</th>
      <th class="num">Recall</th><th class="num">nDCG</th><th class="num">Rank</th>
      <th>Esperado vs recuperado</th>
    </tr></thead>
    <tbody>${run.per_query.map(q => `
      <tr>
        <td class="rid">${esc(q.query_id)}</td>
        <td class="qtext">${esc(q.question)}
            <span class="pill ${q.verdict}">${q.verdict}</span>
            ${(q.rewrites || []).map(v => `<div class="dim">↳ ${esc(v)}</div>`).join('')}
            ${q.documents ? `<div class="dim">camada 1: ${q.documents.map(f => f === q.filename ? `<b>${esc(f)}</b>` : esc(f)).join(', ')}${q.documents.includes(q.filename) ? '' : ' · <span class="err">documento certo fora</span>'}</div>` : ''}</td>
        <td class="rid">${q.type === 'multi_chunk' ? 'multi' : 'single'}</td>
        <td class="num">${fmt(q.recall)}</td>
        <td class="num">${fmt(q.ndcg)}</td>
        <td class="num">${q.best_rank ?? '—'}</td>
        <td class="chunks">
          ${q.expected.map(e => {
            const got = q.retrieved.find(r => r.chunk_id === e)
            return got
              ? `<div class="hit">✓ ${esc(e)} · rank ${got.rank} · ${got.similarity}</div>`
              : `<div class="miss">✗ ${esc(e)} · não veio</div>`
          }).join('')}
          <div class="miss">top-${q.k}: ${q.retrieved.map(r =>
            r.expected ? `<b class="hit">${esc(r.chunk_id)}</b>` : esc(r.chunk_id)).join(' · ') || '—'}</div>
        </td>
      </tr>`).join('')}
    </tbody>`
  $('detail-sec').hidden = false
  if (scroll) $('detail-sec').scrollIntoView({ behavior: 'smooth', block: 'start' })
}

// ── Carga ──────────────────────────────────────────────
// Rechamada depois de cada run: o index.json acabou de mudar no disco.
async function load(select) {
  const r = await fetch('runs/index.json', { cache: 'no-store' })
  if (!r.ok) throw new Error(`HTTP ${r.status}`)
  const { runs } = await r.json()
  if (!runs.length) {
    $('sub').textContent = ''
    $('empty').hidden = false
    $('empty').innerHTML = 'Nenhuma execução ainda. Use o botão <b>Rodar</b> aí em cima.'
    $('trend-sec').hidden = $('runs-sec').hidden = $('detail-sec').hidden = true
    return
  }
  $('empty').hidden = true
  $('sub').textContent = `${runs.length} execução(ões) · ${runs[0].config.n_queries} perguntas`
  renderSparks(runs)
  renderRuns(runs)
  $('trend-sec').hidden = false
  $('runs-sec').hidden = false
  // pré-seleciona sem roubar o scroll, exceto quando é o run recém-criado
  showDetail(select || runs[0].run_id, Boolean(select))
}

load().catch(e => {
  $('sub').textContent = ''
  $('empty').hidden = false
  $('empty').innerHTML = `Falha ao ler <code>runs/index.json</code> (${esc(e.message)}). Sirva esta página por HTTP: <code>cd eval &amp;&amp; docker compose up -d ui</code>`
  console.error(e)
})

$('del-run').onclick = async () => {
  const id = $('del-run').dataset.run
  if (!id || !confirm(`Excluir a execução ${id}? O arquivo runs/${id}.json é apagado.`)) return
  const r = await fetch(`api/runs/${id}`, { method: 'DELETE' })
  if (!r.ok) return alert((await r.json()).error || `HTTP ${r.status}`)
  load()
}

// ── Rodar ──────────────────────────────────────────────
// Sem streaming de progresso: a resposta só volta no fim. As perguntas levam
// ~1 min, e o log ao vivo está no `docker compose logs -f ui`.
// Buckets come from week04: only `ready` ones that carry a gabarito.
// The run's label is set server-side: bucket name (<chunker> · <retriever>) + rerank + k.
async function loadOptions() {
  try {
    const r = await fetch('api/options', { cache: 'no-store' })
    const o = await r.json()
    if (!r.ok) throw new Error(o.error || `HTTP ${r.status}`)
    $('bucket').innerHTML = '<option value="">escolha o chunks bucket</option>' + o.buckets.map(b =>
      `<option value="${esc(b.id)}" data-ret="${esc(b.retriever)}" data-name="${esc(b.name)}">${esc(b.name)} · ${esc(b.retriever)} · ${b.chunk_count} chunks · ${b.qrels_count} qrels</option>`).join('')
    $('rerank').innerHTML = '<option value="">sem rerank</option>' + Object.entries(o.rerankers || {}).map(([n, m]) =>
      `<option value="${esc(n)}" title="${esc(m)}">${esc(n)}</option>`).join('')
    const rt = o.rerank_tuning  // null before week10
    $('rerank-tuning').hidden = !rt
    if (rt) {
      $('rerank_depth').value = rt.depth
      $('rerank_keep').value = rt.keep
      $('rerank-hint').textContent = 'Um cross-encoder relê os primeiros e vota junto com a busca.'
    }
    $('rerank').onchange = () => { $('rerank_depth').disabled = $('rerank_keep').disabled = !$('rerank').value }
    $('rerank').onchange()
    $('stage-docs').hidden = !o.descriptions  // null before week09
    if (o.two_layer) $('doc_top').value = o.two_layer.doc_top
    $('docs').onchange = () => { $('doc_top').disabled = !$('docs').value }
    $('docs').onchange()
    if (o.descriptions) $('docs').innerHTML = '<option value="">todos os PDFs</option>' + o.descriptions.map(b =>
      `<option value="${esc(b.id)}">${esc(b.name)} · ${b.doc_count} docs · ${esc(b.id)}</option>`).join('')
    const t = o.transform  // null before week08
    $('stage-q').hidden = !t
    if (t) $('variants').innerHTML = '<option value="0">só a original</option>' +
      Array.from({ length: t.max_variants }, (_, i) => `<option value="${i + 1}" title="${esc(t.model)}">${i + 1} variante${i ? 's' : ''}</option>`).join('')
  } catch (err) {
    $('runmsg').className = 'err'
    $('runmsg').textContent = `opções indisponíveis: ${err.message} (week04 de pé?)`
  }
}
loadOptions()
// Progress comes from the server (GET api/progress), so a reload or a second
// tab picks up a run already in flight. ownRun: this tab's POST is still open.
let poll = null, ownRun = false
function watch() {
  $('go').disabled = true
  $('go').textContent = '⏳ rodando…'
  $('runmsg').className = ''
  $('runmsg').textContent = ''
  $('progmsg').textContent = 'avaliando…'
  $('progress-sec').hidden = false
  $('runbar-progress').removeAttribute('value')  // indeterminate until the first answer
  $('cancel').disabled = false
  if (!poll) poll = setInterval(tick, 1000)
}
function unwatch() {
  clearInterval(poll); poll = null
  $('progress-sec').hidden = true
  $('go').disabled = false
  $('go').textContent = '▶ Rodar'
}
async function tick() {
  let p
  try { p = await (await fetch('api/progress', { cache: 'no-store' })).json() } catch { return }
  if (!p.running) {
    if (!ownRun) { unwatch(); load() }  // someone else's run ended
    return
  }
  if (!poll) watch()
  if (!p.total) return
  const bar = $('runbar-progress')
  bar.max = p.total; bar.value = p.done
  const s = Math.round(Date.now() / 1000 - p.started)
  const eta = p.done ? Math.round(s / p.done * (p.total - p.done)) : null
  $('progmsg').textContent = p.cancel ? `cancelando… termina a pergunta ${p.query_id}`
    : `${p.done}/${p.total} · ${p.query_id ?? ''} · ${s}s${eta !== null ? ` · faltam ~${eta}s` : ''}`
}
tick()  // a run already going when the page opens

$('cancel').onclick = async () => {
  $('cancel').disabled = true
  await fetch('api/cancel', { method: 'POST' }).catch(() => {})
  tick()
}

$('runf').onsubmit = async e => {
  e.preventDefault()
  const msg = $('runmsg')
  ownRun = true
  watch()
  try {
    const r = await fetch('api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bucket: $('bucket').value, rerank: $('rerank').value, variants: Number($('variants').value), docs: $('docs').value, doc_top: Number($('doc_top').value), k: Number($('k').value), sample: Number($('sample').value),
        ...(!$('rerank-tuning').hidden && $('rerank').value ? { rerank_depth: Number($('rerank_depth').value), rerank_keep: Number($('rerank_keep').value) } : {}) }),
    })
    const d = await r.json()
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`)
    msg.textContent = `ok · ${d.run_id}`
    await load(d.run_id)
  } catch (err) {
    const cancelled = err.message.startsWith('cancelado')
    msg.className = cancelled ? '' : 'err'
    msg.textContent = cancelled ? err.message : `falhou: ${err.message}`
  } finally {
    ownRun = false
    unwatch()
  }
}
</script>
</body>
