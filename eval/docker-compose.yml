# Runs the eval against a week04 bucket. week04 must already be up.
#
#   docker compose up -d ui                        # painel em :8080, roda pelo botão
#   docker compose run --rm eval --options         # buckets prontos + datasets
#   docker compose run --rm eval --bucket 59cb0095 --dataset legal-1200 --label "e5-base"
#   docker compose run --rm eval --list
#
services:

  # `profiles` mantém este serviço fora do `docker compose up`: sem ele, subir o
  # painel dispararia uma avaliação inteira sem querer. `run` ignora profiles.
  eval:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_URL: http://chunks-api:8000
      DATASET_DIR: /dataset
    volumes:
      - .:/eval
      - ../dataset/out:/dataset:ro
    networks:
      - week04

  # Serve index.html e atende POST /api/run — o mesmo run.py, importado no
  # processo. Por isso precisa da rede do week04 e do dataset, ao contrário do
  # servidor estático que havia aqui antes, e do volume sem `:ro`: o run grava
  # em runs/.
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "server.py"]
    environment:
      API_URL: http://chunks-api:8000
      DATASET_DIR: /dataset
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - .:/eval
      - ../dataset/out:/dataset:ro
    networks:
      - week04

# week04's compose network; the bucket to score is chosen per run, not per stack.
networks:
  week04:
    external: true
    name: week04_default
