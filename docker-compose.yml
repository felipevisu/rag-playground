# Everything in one stack: week08 (postgres, chunks-api, chunks-ui), the eval
# panel and the dataset UI (week05).
#
#   docker compose up --build
#   week08 UI :3000   API :8000/docs   eval :8080   dataset :8765
#
#   docker compose run --rm dataset-build configs/legal-1200.yaml
#   docker compose run --rm eval --bucket 59cb0095 --dataset legal-1200
#
# Project named week05 (as week08/docker-compose.yml is) to reuse its pgdata volume.
# Bring the standalone week05/week06/week07/week08/eval stacks down first — same ports.
name: week05

include:
  - week08/docker-compose.yml

services:
  # Renamed via extends: dataset and eval both call their UI `ui`.
  dataset-ui:
    extends: { file: week05/docker-compose.yml, service: ui }
  dataset-build:
    extends: { file: week05/docker-compose.yml, service: build }
    profiles: ["cli"]

  eval-ui:
    extends: { file: eval/docker-compose.yml, service: ui }
    networks: !override [default]
    depends_on: [chunks-api]
  eval:
    extends: { file: eval/docker-compose.yml, service: eval }
    networks: !override [default]
