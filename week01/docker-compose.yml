services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot. Reads the frozen chunks from dataset/out, embeds them, exits.
  # Skips itself when the same corpus and model are already in Postgres.
  loader:
    build:
      context: ./services/loader
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      DATASET_DIR: /dataset
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ../dataset/out:/dataset:ro
      - ~/.cache/huggingface:/root/.cache/huggingface

  document-api:
    build:
      context: ./services/document-api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"

  chat:
    build:
      context: ./services/chat
      dockerfile: Dockerfile
    depends_on:
      - document-api
    env_file:
      - ./.env
    environment:
      DOCUMENT_API_URL: http://document-api:8000
      CLAUDE_MODEL: claude-sonnet-5
    ports:
      - "3001:3001"

  documents-ui:
    build:
      context: ./services/documents-ui
      dockerfile: Dockerfile
    depends_on:
      - document-api
    ports:
      - "3000:3000"
    volumes:
      - ./services/documents-ui/src:/app/src
      - ./services/documents-ui/index.html:/app/index.html

volumes:
  pgdata:
