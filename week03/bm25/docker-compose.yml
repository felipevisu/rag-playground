# Project name pinned: the compose network the eval attaches to is derived from
# it, and it would otherwise follow this directory's name.
name: week03-bm25

# Host ports shifted again (+2 / +20 from week01) so all three stacks can be up
# at once and be scored back to back. Container ports and service names are
# unchanged, so nothing inside the network had to move.
services:

  # Plain postgres, not pgvector/pgvector: there is no vector column to store.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot. Reads the frozen chunks from dataset/out and writes them. That is
  # the whole load — no model download, no embedding pass, a few seconds.
  loader:
    build:
      context: ./services/loader
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      DATASET_DIR: /dataset
    volumes:
      - ../../dataset/out:/dataset:ro

  document-api:
    build:
      context: ./services/document-api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
    ports:
      - "8002:8000"

  chat:
    build:
      context: ./services/chat
      dockerfile: Dockerfile
    depends_on:
      - document-api
    env_file:
      - ./.env
    environment:
      DOCUMENT_API_URL: http://document-api:8000
      CLAUDE_MODEL: claude-sonnet-5
    ports:
      - "3021:3001"

  documents-ui:
    build:
      context: ./services/documents-ui
      dockerfile: Dockerfile
    depends_on:
      - document-api
    ports:
      - "3020:3000"
    volumes:
      - ./services/documents-ui/src:/app/src
      - ./services/documents-ui/index.html:/app/index.html

volumes:
  pgdata:
