# Dataset tooling. Run by hand when the PDFs, the questions or a chunker config change.
#
#   docker compose run --rm build configs/legal-1200.yaml   # one config -> out/<name>/
#   docker compose up ui                                    # http://localhost:8765
#
# Or skip docker: cd build && python -m venv venv && venv/bin/pip install -r requirements.txt
services:
  build:
    build: ./build
    volumes:
      - .:/dataset
      - ~/.cache/huggingface:/root/.cache/huggingface   # tokenizers, for unit=tokens
  ui:
    build: ./build
    entrypoint: ["python", "build/serve.py"]
    environment: { HOST: 0.0.0.0 }
    ports: ["8765:8765"]
    volumes:
      - .:/dataset
      - ~/.cache/huggingface:/root/.cache/huggingface
