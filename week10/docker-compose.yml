# Upload a corpus.parquet from dataset/out/<config>/, build indexes on it with
# different retrievers (MiniLM, multilingual-e5, BM25, hybrid, + cross-encoder,
# + Claude query rewrites, + a descriptions bucket as layer 1 via ?docs=), search.
# week10: rerankers see the document name and vote with the first stage (RERANK_KEEP).
#
#   docker compose up --build
#   UI  http://localhost:3000     API http://localhost:8000/docs
#
# Same ports as week01 — bring one stack up at a time.
name: week11              # own volume (week11_pgdata): week11 corpus only, week05 buckets stay in week05_pgdata

services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  chunks-api:
    build: ./services/chunks-api
    env_file:                            # API keys (VOYAGE_API_KEY); copy .env.example to .env
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      HF_HOME: /root/.cache/huggingface
      WATCHFILES_FORCE_POLLING: "true"   # macOS bind mounts don't emit inotify events
      # Retrieval knobs (defaults shown). Change, `docker compose up -d`, re-run eval.
      BM25_VARIANT: Okapi                # Okapi | Plus | L
      BM25_K1: "1.5"
      BM25_B: "0.75"
      RRF_K: "60"
      RRF_DEPTH: "50"
      RRF_BM25_WEIGHT: "1.0"             # vector side is 1.0
      RERANK_DEPTH: "30"                 # candidates the cross-encoder rescores (50 was ~15-80s/question on CPU)
      RERANK_KEEP: "1.0"                 # first-stage vote in the rerank RRF (reranker is 1.0); 0 = reranker alone, as in week09
      RERANK_URL: ${RERANK_URL:-}        # e.g. http://host.docker.internal:8001 = rerank-server/serve.py on the Mac GPU; empty = in this container
      DOC_TOP: "5"                       # ?docs=: documents (by description) whose chunks are searched; ?doc_top= overrides
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface   # models download once
      - ./services/chunks-api:/app                       # edit main.py without rebuild
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"

  chunks-ui:
    build: ./services/chunks-ui
    depends_on:
      - chunks-api
    ports:
      - "3000:3000"
    volumes:
      - ./services/chunks-ui:/app:ro   # edit index.html without rebuild

volumes:
  pgdata:
